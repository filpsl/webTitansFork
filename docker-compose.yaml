services:
  auth:
    container_name: siteTitans
    image: siteTitans
    build:
      context: .
      target: deps
    env_file:
      - .env  
    ports:
      - "5000:8080"
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  node_modules:
